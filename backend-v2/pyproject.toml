[project]
name = "hackathon-backend-v2"
version = "0.5.0"
description = "Modular FastAPI backend for the hackathon system."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
