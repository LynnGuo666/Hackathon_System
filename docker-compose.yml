services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-secret}
      - DATABASE_PATH=/data/hackathon.sqlite
      - STATIC_DIR=/app/frontend/out
      - SECRET_KEY_FILE=/data/.secret_key
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped

volumes:
  db-data:
